name: pantrysnap
description: PantrySnap - AI Pantry Scanner that turns a photo of your fridge into recipes.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # --- AI / Vision ---
  google_generative_ai: ^0.4.6      # Gemini multimodal SDK

  # --- Camera / Image ---
  image_picker: ^1.1.2
  image: ^4.2.0                     # downscale/compress before sending to the model

  # --- Local storage (offline saved recipes) ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # --- State management ---
  provider: ^6.1.2

  # --- Utilities ---
  flutter_dotenv: ^5.1.0            # keep the Gemini API key out of source control
  uuid: ^4.4.0
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/pantrysnap_square.png
    - assets/images/pantrysnap_transparent.png